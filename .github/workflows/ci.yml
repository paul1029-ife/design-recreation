name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Structural audit of the pattern library: folder shape, registry and
      # demo wiring, metadata completeness, naming. Catches the class of
      # mistake that produces a page with no demo and no error.
      - name: Audit library
        run: npm run audit:library

      # Every colour resolves to a token, so contrast is decidable from
      # globals.css alone. A token edit that drops a pairing below WCAG AA
      # fails here rather than shipping.
      - name: Audit contrast
        run: npm run audit:contrast

      - name: Build
        run: npm run build
